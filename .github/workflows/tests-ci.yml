name: Tests CI

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install Dependencies
      run: sudo apt-get update && sudo apt-get install -y build-essential
    - name: Compile Source Code
      run: make
    - name: Run Tests
      run: make test-verbose
